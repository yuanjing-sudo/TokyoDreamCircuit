; ============================================================================
;  Tokyo Dream Circuit - engine configuration
;
;  The rendering settings here are the "cinematic realism" baseline:
;  Lumen (software + hardware ray traced) for global illumination and
;  reflections, Nanite for geometry, Virtual Shadow Maps, Substrate materials,
;  TSR for anti-aliasing, and volumetric fog / sky atmosphere.
;
;  Hardware ray tracing is only meaningful on an RTX-class GPU. Everything
;  else still runs (slower, with software Lumen) on a GTX 10-series card.
; ============================================================================

[/Script/EngineSettings.GameMapsSettings]
; Point these at the level you build once the project compiles, for example:
; GameDefaultMap=/Game/Maps/TokyoCircuit.TokyoCircuit
; EditorStartupMap=/Game/Maps/TokyoCircuit.TokyoCircuit
; GlobalDefaultGameMode=/Game/Blueprints/BP_TokyoDreamGameMode.BP_TokyoDreamGameMode_C
bUseSplitscreen=False
TwoPlayerSplitscreenLayout=Horizontal
bOffsetPlayerGamepadIds=False

[/Script/Engine.RendererSettings]
; ---- Global illumination: Lumen -------------------------------------------
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.LightingMode=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.Reflections.HardwareRayTracing=1
r.Lumen.Reflections.BilateralFilter=1
r.Lumen.Reflections.ScreenSpaceReconstruction=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.4
r.LumenScene.Radiosity=1
r.LumenScene.SurfaceCache.Resolution=1024
r.GenerateMeshDistanceFields=True
r.DistanceFields.DefaultVoxelDensity=0.1

; ---- Geometry: Nanite ----------------------------------------------------
r.Nanite.ProjectEnabled=1
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=1.0
r.Nanite.ProxyRenderMode=0

; ---- Shadows -------------------------------------------------------------
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.Cache=1

; ---- Materials: Substrate ------------------------------------------------
; Substrate replaces the classic shading model with a physically layered one.
; Leave at 0 if your engine build reports it as unstable.
r.Substrate=1
r.Substrate.ClosuresPerPixel=4

; ---- Anti-aliasing and upscaling ----------------------------------------
; 4 = TSR (Temporal Super Resolution). This is what gives clean edges at speed.
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=200
r.TSR.ShadingRejection.Flickering=1
r.ScreenPercentage=100
r.SecondaryScreenPercentage.GameViewport=100

; ---- Ray tracing / global toggles ---------------------------------------
r.RayTracing=True
r.RayTracing.Shadows=True
r.RayTracing.AmbientOcclusion=False
r.RayTracing.SkyLight=True

; ---- Virtual texturing --------------------------------------------------
r.VirtualTextures=True
r.VT.EnableAutoImport=True

; ---- Lighting model -----------------------------------------------------
; Everything is dynamic, so no baked lightmaps are needed anywhere.
r.AllowStaticLighting=False

; ---- Default post process features --------------------------------------
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AntiAliasing=4

; ============================================================================
;  Runtime cvar defaults ([SystemSettings] is applied on every launch)
; ============================================================================
[SystemSettings]
; Motion blur is a large part of the "speed" feel. Amount is 0..1.
r.MotionBlurQuality=4
r.MotionBlur.Amount=0.35
r.MotionBlur.Max=0.6
r.MotionBlur.Scale=1.0

r.BloomQuality=5
r.Bloom.ScreenPercentage=100
r.DepthOfFieldQuality=4
r.LensFlareQuality=0
r.Tonemapper.Quality=5
r.Tonemapper.Sharpen=0.6
r.Tonemapper.GrainQuantization=1
r.Tonemapper.ScreenPercentage=100

; Volumetrics: light shafts through the Tokyo skyline and off street lamps.
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
r.SkyAtmosphere=1
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=32

; Wet-road reflections and rain.
r.RefractionQuality=2
r.SSR.Quality=4
r.SSR.MaxRoughness=0.6
r.Water.SingleLayer.Reflection=1
r.Water.SingleLayer.SSR=1

; Streaming budget: 0 means "use as much VRAM as you have".
r.Streaming.PoolSize=0
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.HLODStrategy=2

; Lumen stability at high speed (reduces shimmer on fast-camera movement).
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=24
r.Lumen.Reflections.Temporal.MaxFramesAccumulated=16

[/Script/Engine.PhysicsSettings]
; The car is tuned in SI units and integrated at a fixed 60 Hz-ish step.
; 1/60 = 0.01667. Smaller steps = more stable at 360 km/h.
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=4
DefaultGravityZ=-980.000000

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
bEnableMouseSmoothing=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM6
-Compiler=Default
