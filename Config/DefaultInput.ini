; Input mappings for the car. The C++ pawn binds exactly these four names:
;   Throttle  -1..1   (negative = reverse)
;   Steer     -1..1
;   Brake      0..1
;   Handbrake  0..1
;
; Increase the gamepad/keyboard scale values to taste: Scale is applied before
; any smoothing in the tyre model, so 0.7 gives finer keyboard steering.

[/Script/Engine.InputSettings]
-AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=Gamepad_RightTriggerAxis)
-AxisMappings=(AxisName="Brake",Scale=1.000000,Key=S)
+AxisMappings=(AxisName="Brake",Scale=1.000000,Key=S)
+AxisMappings=(AxisName="Brake",Scale=1.000000,Key=Down)
+AxisMappings=(AxisName="Brake",Scale=1.000000,Key=Gamepad_LeftTriggerAxis)
-AxisMappings=(AxisName="Steer",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Steer",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Steer",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="Steer",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="Steer",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="Steer",Scale=1.000000,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="Handbrake",Scale=1.000000,Key=SpaceBar)
+AxisMappings=(AxisName="Handbrake",Scale=1.000000,Key=Gamepad_FaceButton_Bottom)

+ActionMappings=(ActionName="ResetCar",Key=R)
+ActionMappings=(ActionName="TogglePhysics",Key=P)

bCaptureMouseOnLaunch=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
